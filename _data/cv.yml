    Publications:
      - title: Filtern. Zur Theorie einer Kulturtechnik des 21. Jahrhunderts
        authors:
          - Alwin J. Cubasch
          - Christian Kassung
        publisher: "Berlin and Boston: dG Arts"
        releaseDate: 2024
        doi: 10.1515/9783689242220
        summary: "Der Begriff der Kulturtechnik befindet sich aktuell in einem entscheidenden Wandlungsprozess: dem Wechsel vom Apparat zur Umgebung. Kulturtechniken lassen sich nicht länger in Relation zu bestimmten einzelnen Gegenständen oder isolierten Situationen denken. Vielmehr sind sie zu environing technologies geworden, in denen die Differenz von Natur und Kultur aufgehoben ist."

      - title: Fleisch. Die Geschichte einer Industrialisierung
        authors:
          - Christian Kassung
        publisher: "Paderborn: Ferdinand Schönigh"
        releaseDate: 2020
        url: "https://brill.com/view/title/56249"
        summary: "Roh, gekocht, kalt, heiß, fettig oder mager – Fleisch ist heute überall und jederzeit verfügbar. Die allgegenwärtige Verfügbarkeit von Fleisch als Konsumware unterscheidet unsere Moderne von allen vorherigen Epochen. Wer verstehen will, warum und wie wir Fleisch essen, muss ins Berlin des 19. Jahrhunderts zurückgehen. Hier erlangte Fleisch jene Selbstverständlichkeit, die im Zentrum der aktuellen Ernährungsdebatten steht."

